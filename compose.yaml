name: scan-collector

services:
  scan-collector:
    image: ${IMAGE:-ghcr.io/cuchulain/scan-collector:latest}
    environment:
      AUTH_USER: ${AUTH_USER:?Set AUTH_USER in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
    ports:
      - "${PORT:-8765}:8765"
    volumes:
      - ./data:/data
    restart: unless-stopped
